# ProtForge Configuration Template for Kempner Cluster
# Copy this file to config.yaml and update paths marked with <YOUR_USER>

# Which pipeline stages to run
pipeline:
  msa: true
  boltz: true
  esm: true
  esmfold: false  # ESMFold2 structure prediction (alternative to Boltz)

# Input data
input:
  fasta_dir: /n/home06/<YOUR_USER>/data/fastas
  # yaml_dir: /path/to/existing/yamls  # Use when pipeline.msa is false

# Output directory
output:
  parent_dir: /n/home06/<YOUR_USER>/outputs

# MSA generation - SHARED RESOURCES (no changes needed)
msa:
  max_files_per_job: 25
  array_max_concurrency: 10
  mmseq2_db: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/mmseq2_db
  colabfold_db: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/colabfold_db

# Boltz structure prediction - SHARED RESOURCES (no changes needed)
boltz:
  max_files_per_job: 25
  array_max_concurrency: 10
  delete_msa_after_processing: false
  recycling_steps: 10
  diffusion_samples: 25
  samples_to_save: 1                 # int (1..diffusion_samples) or "all".
                                     # Top-N keeps model_0..model_(N-1); model_0 = best confidence.
  num_runs: 1                        # Number of independent Boltz runs per sequence
  # max_seq_len: 1500                # Optional: drop sequences longer than this (residues).
                                     # Skipped entries are listed in boltz_chunks/skipped_sequences.tsv.
  # Boltz model weights. Bound into the container at /weights (the rule passes
  # `boltz predict --cache /weights`).
  cache_dir: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/boltz_db
  colabfold_db: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/colabfold_db

# ESM embeddings - USER SETUP REQUIRED
# See docs/CLUSTER_SETUP.md for environment setup instructions
esm:
  num_chunks: 1
  array_max_concurrency: 20
  env_path: /n/home06/<YOUR_USER>/envs/esm
  # Container mode: bind your host HF cache to /models/hf (see
  # containers.bind_paths) and keep this path. Populate the host cache with:
  #   python scripts/download_models.py --cache-dir <PROTFORGE_ROOT>/models/hf
  cache_dir: /models/hf
  # Legacy mode example (uncomment + adapt):
  # cache_dir: /n/holylfs06/LABS/bsabatini_lab/Everyone/esm_models_cache
  # NOTE (legacy mode only): the ESM library has hardcoded model paths in
  # esm/utils/constants/esm3.py. Update those to match `cache_dir`. See
  # docs/CLUSTER_SETUP.md.

# ESMFold structure prediction - USER SETUP REQUIRED
# In CONTAINER mode, bind your host HF cache to /models/hf and keep
# cache_dir set to that mounted path. In LEGACY (conda env) mode, first
# populate a host HF cache with scripts/download_models.py or
# scripts/download_esmfold.py, then set cache_dir to that host path.
esmfold:
  input_type: yaml  # "yaml" (post-MSA from sequences/) or "fasta" (raw input.fasta_dir, independent of MSA/Boltz)
  num_chunks: 1
  array_max_concurrency: 10
  env_path: /n/home06/<YOUR_USER>/envs/esmfold
  cache_dir: /models/hf
  # Example for legacy mode (uncomment + adapt):
  # cache_dir: /n/holylfs06/LABS/bsabatini_lab/Everyone/esm_models_cache  # HF_HOME root; must contain hub/models--facebook--esmfold_v1
  # Optional length cutoff. Sequences longer than this are dropped before
  # chunking and listed in esmfold_chunks/skipped_sequences.tsv.
  # max_seq_len: 2500
  # Smart binning: when true, the chunker partitions sequences into a "short"
  # pool (L < length_threshold) and a "long" pool (L >= length_threshold) and
  # chunks each pool separately. The run rule applies pool-specific SLURM
  # resources (mem_short/long_mb, time_short/long_min). Use this when you have
  # a mix of short and long proteins — long ones use the slower trunk-chunked
  # path, short ones don't pay that overhead.
  bin_by_length: false
  length_threshold: 1200             # H100 80GB OOM ceiling observed in calibration
  num_chunks_short: 1                # Chunks for short pool (only when bin_by_length: true)
  num_chunks_long: 1                 # Chunks for long pool  (only when bin_by_length: true)
  mem_short_mb: 32000                # SLURM mem for short-pool jobs
  mem_long_mb: 80000                 # SLURM mem for long-pool jobs (close to H100 80GB)
  time_short_min: 60                 # SLURM runtime for short-pool jobs
  time_long_min: 240                 # SLURM runtime for long-pool jobs (trunk-chunking is slower)
  # Trunk chunking inside run_esmfold.py. When a sequence's L is at least
  # chunk_size_threshold, model.trunk.set_chunk_size(chunk_size) is invoked to
  # avoid OOM at the cost of ~50% slower per-residue runtime.
  chunk_size_threshold: 1200
  chunk_size: 64

# ---------------------------------------------------------------------------
# Bin-aware chunking (per stage) — OPTIONAL
# ---------------------------------------------------------------------------
# When enabled for a stage, the chunker partitions sequences into length bins
# and packs each bin into its own chunks with bin-specific SLURM mem/runtime.
# Short sequences pack many-per-chunk (amortize startup); long sequences pack
# few-per-chunk (avoid OOM/timeout).
#
# The webapp's "Apply to session config" button populates the `bins:` recipe
# from webapp/scaling_models.yaml. CLI users can write the recipe by hand.
# When `binning.enabled: false` (default) chunking is by count as before, and
# `slurm.resources.<stage>.{mem_mb, runtime}` is what each chunk gets.
#
# Example block (paste under boltz: / esmfold: / esm: / msa: as needed):
#
# boltz:
#   binning:
#     enabled: true
#     mode: quantile               # quantile | thresholds
#     num_bins: 6                  # quantile mode: number of bins
#     # thresholds: [400, 800, 1200, 1800]   # thresholds mode: explicit cuts
#     chunks_per_bin: 5            # parallel chunks per non-empty bin
#                                  #   total chunks ≈ num_bins × chunks_per_bin
#                                  #   bins with < chunks_per_bin items make
#                                  #   one chunk per item.
#     startup_overhead_min: 5      # added to per-bin runtime estimate
#     bins:                        # mem/runtime per bin (smallest L first)
#       - {mem_mb: 16000, runtime_min:  30}
#       - {mem_mb: 24000, runtime_min:  45}
#       - {mem_mb: 32000, runtime_min:  60}
#       - {mem_mb: 50000, runtime_min:  90}
#       - {mem_mb: 80000, runtime_min: 180}
#       - {mem_mb: 80000, runtime_min: 240}
#
# Container images (Singularity .sif files) — OPTIONAL
# Set `gpu` to the single ProtForge GPU SIF (built from containers/protforge-gpu.def)
# to run colabfold/boltz/esm/esmfold inside the container. Leave empty for legacy
# conda-env mode. Per-stage keys override `gpu` when set (used once we split the
# image, e.g. PDAnalysis ships in its own MPI SIF).
containers:
  # Container runtime to invoke. "auto" (default) picks singularity if on
  # PATH, else apptainer. Override to "apptainer" or "singularity" to force.
  # On Kempner the binary is named `singularity` — whether that's
  # SingularityCE or Apptainer's compat symlink doesn't affect us.
  runtime: auto
  # Single SIF for all GPU stages (MSA / Boltz / ESM-C / ESMFold).
  gpu: ""          # e.g., /n/holylfs06/.../<YOUR_USER>/sifs/protforge-gpu.sif
  # Per-stage overrides (optional — leave empty to use `gpu` above).
  colabfold: ""
  boltz: ""
  esm: ""
  esmfold: ""
  # Comma-separated bind list. Each entry is one of:
  #   - host                  (host:host, rw — for writable workspace dirs)
  #   - host:ro      (or :rw) (host:host bind at given mode — shortcut)
  #   - host:container        (rebind to a different in-container path)
  #   - host:container:ro|rw  (same with explicit mode)
  #
  # Default policy below = bind each shared DB at the SAME path inside the
  # container, read-only. Stage configs below (msa.mmseq2_db, boltz.cache_dir,
  # etc.) keep their host paths and work unchanged in container mode. The
  # model cache bind maps the user's HF cache to /models/hf read-only. The
  # writable bind covers the user's home dir; add your lab's holylfs path too
  # if the repo or output dir lives there.
  #
  # The Snakefile additionally auto-binds ${SLURM_TMPDIR:-/tmp} at /tmp for
  # scratch (Boltz/Triton/HF temp files), no need to list it here.
  #
  # Alternate `/data/*` convention (see containers/protforge-gpu.def %environment):
  # if you prefer the canonical in-container paths, replace each `host:ro`
  # below with `host:/data/<name>:ro` AND change the matching stage config
  # values (msa.mmseq2_db, msa.colabfold_db, boltz.cache_dir) to `/data/...`.
  bind_paths: "/n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/mmseq2_db:ro,/n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/colabfold_db:ro,/n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/boltz_db:ro,/n/home06/<YOUR_USER>/protforge/models/hf:/models/hf:ro,/n/home06/<YOUR_USER>"

# SLURM settings - UPDATE FOR YOUR ACCOUNT
slurm:
  log_dir: /n/home06/<YOUR_USER>/job_logs
  partition: kempner_requeue
  account: <YOUR_SLURM_ACCOUNT>  # e.g., kempner_yourpi_lab
  email: <YOUR_EMAIL>  # e.g., user@example.com (for SLURM job notifications)
  # Per-job partition overrides (optional):
  # msa:
  #   partition: kempner
  # boltz:
  #   partition: kempner
  #
  # Per-stage SLURM resource overrides (optional). Populated automatically by
  # the webapp's resource estimator (Import dialog → "Apply to session config").
  # Each entry maps a Snakemake `resources:` field; gpus=0 disables GPU request.
  # resources:
  #   msa:     {mem_mb: 48000, runtime: 60,  cpus_per_task: 4,  gpus: 1}
  #   boltz:   {mem_mb: 16000, runtime: 60,  cpus_per_task: 8,  gpus: 1}
  #   esm:     {mem_mb: 32000, runtime: 60,  cpus_per_task: 16, gpus: 1}
  #   esmfold: {mem_mb: 32000, runtime: 120, cpus_per_task: 8,  gpus: 1}
