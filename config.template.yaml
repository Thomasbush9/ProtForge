# ProtForge Configuration Template for Kempner Cluster
# Copy this file to config.yaml and update paths marked with <YOUR_USER>

# Which pipeline stages to run. esmc / esmfold run off the MSA-stage YAMLs
# (in parallel with Boltz) and default OFF in the Snakefile.
pipeline:
  msa: true
  boltz: true
  esmc: false      # ESM-C embeddings (one stage per model size; see esmc:)
  esmfold: false   # ESMFold2 structure prediction (see esmfold:)

# Input data
input:
  fasta_dir: /n/home06/<YOUR_USER>/data/fastas
  # yaml_dir: /path/to/existing/yamls  # Use when pipeline.msa is false

# Output directory
output:
  parent_dir: /n/home06/<YOUR_USER>/outputs

# MSA generation - SHARED RESOURCES (no changes needed)
msa:
  max_files_per_job: 25
  array_max_concurrency: 10
  mmseq2_db: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/mmseq2_db
  colabfold_db: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/colabfold_db

# Boltz structure prediction - SHARED RESOURCES (no changes needed)
boltz:
  max_files_per_job: 25
  array_max_concurrency: 10
  delete_msa_after_processing: false
  recycling_steps: 10
  diffusion_samples: 25
  samples_to_save: 1                 # int (1..diffusion_samples) or "all".
                                     # Top-N keeps model_0..model_(N-1); model_0 = best confidence.
  num_runs: 1                        # Number of independent Boltz runs per sequence
  # max_seq_len: 1500                # Optional: drop sequences longer than this (residues).
                                     # Skipped entries are listed in boltz_chunks/skipped_sequences.tsv.
  # Boltz model weights. Bound into the container at /weights (the rule passes
  # `boltz predict --cache /weights`).
  cache_dir: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/boltz_db
  colabfold_db: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/colabfold_db

# ESM-C embeddings (Biohub ESMC) — runs after MSA, in parallel with Boltz.
# `models` is any subset of {6B, 600M, 300M}; each size is its own stage with
# its own jobs, resources (slurm.resources.esmc_<size>) and
# .esmc_<size>_complete sentinel. Outputs -> sequences/{seq}/esmc/{size}/.
esmc:
  models: [600M]          # subset of: 6B, 600M, 300M
  max_files_per_job: 25   # sequences per encode job (also the padded batch size)
  # HOST HuggingFace cache (contains hub/models--biohub--ESMC-*); bound to
  # /models/hf (ro) in-container. Populate it with:
  #   bash containers/download_scripts/esm_models.sh <cache_dir>
  cache_dir: /n/home06/<YOUR_USER>/protforge/models/hf
  # SAE sparse-activation extraction. Recomputed from the sequence (not from the
  # embeddings above), so it can run standalone on a prior run's YAMLs. One job
  # per size; outputs -> sequences/{seq}/sae/{size}/{sae_type}/. The same ESM
  # container/cache as the embeddings is reused (cache must also hold the SAE
  # repos, e.g. hub/models--biohub--ESMC-<size>-sae-*).
  sae:
    enabled: false
    sae_type: all-layers  # all-layers | mlp
    layers: all           # "all" (every trained layer) or a comma list, e.g. "18,36"
    # sizes: [600M]       # subset of `models` above (default: all of them)
    max_files_per_job: 25

# ESMFold2 structure prediction (Biohub "fast" variant) — runs after MSA.
# Outputs (structure.cif, plddt.npy, metrics.pt) -> sequences/{seq}/esmfold/fast/.
esmfold:
  max_files_per_job: 25
  cache_dir: /n/home06/<YOUR_USER>/protforge/models/hf  # HOST HF cache (hub/models--biohub--ESMFold2-Fast)
  num_loops: 3
  num_sampling_steps: 50
  seed: 0

# ---------------------------------------------------------------------------
# Bin-aware chunking (per stage) — OPTIONAL
# ---------------------------------------------------------------------------
# When enabled for a stage, the chunker partitions sequences into length bins
# and packs each bin into its own chunks with bin-specific SLURM mem/runtime.
# Short sequences pack many-per-chunk (amortize startup); long sequences pack
# few-per-chunk (avoid OOM/timeout).
#
# The webapp's "Apply to session config" button populates the `bins:` recipe
# from webapp/scaling_models.yaml. CLI users can write the recipe by hand.
# When `binning.enabled: false` (default) chunking is by count as before, and
# `slurm.resources.<stage>.{mem_mb, runtime}` is what each chunk gets.
#
# Example block (paste under boltz: / esmfold: / esm: / msa: as needed):
#
# boltz:
#   binning:
#     enabled: true
#     mode: quantile               # quantile | thresholds
#     num_bins: 6                  # quantile mode: number of bins
#     # thresholds: [400, 800, 1200, 1800]   # thresholds mode: explicit cuts
#     chunks_per_bin: 5            # parallel chunks per non-empty bin
#                                  #   total chunks ≈ num_bins × chunks_per_bin
#                                  #   bins with < chunks_per_bin items make
#                                  #   one chunk per item.
#     startup_overhead_min: 5      # added to per-bin runtime estimate
#     bins:                        # mem/runtime per bin (smallest L first)
#       - {mem_mb: 16000, runtime_min:  30}
#       - {mem_mb: 24000, runtime_min:  45}
#       - {mem_mb: 32000, runtime_min:  60}
#       - {mem_mb: 50000, runtime_min:  90}
#       - {mem_mb: 80000, runtime_min: 180}
#       - {mem_mb: 80000, runtime_min: 240}
#
# Container images (Singularity .sif files)
# Each GPU stage runs inside its per-stage image and binds its own inputs/DB/
# weights/cache in the rule, so no global bind list is needed. Set the .sif
# paths you built. `gpu` is an optional shared fallback used when a per-stage
# key is empty (handy if you bundle several stages into one image — e.g. ESMC
# and ESMFold2 ship in the same ESM image).
containers:
  # Container runtime to invoke. "auto" (default) picks singularity if on
  # PATH, else apptainer. Override to "apptainer" or "singularity" to force.
  # On Kempner the binary is named `singularity`.
  runtime: auto
  gpu: ""          # optional shared fallback SIF (used when a stage key is empty)
  colabfold: ""    # MSA image  (msa.def)
  boltz: ""        # Boltz image (boltz.def)
  esmc: ""         # ESM image  (esmfold_cu.def) — serves ESMC + ESMFold2
  esmfold: ""      # same ESM image as esmc, unless you split them later

# SLURM settings - UPDATE FOR YOUR ACCOUNT
slurm:
  log_dir: /n/home06/<YOUR_USER>/job_logs
  partition: kempner_requeue
  account: <YOUR_SLURM_ACCOUNT>  # e.g., kempner_yourpi_lab
  email: <YOUR_EMAIL>  # e.g., user@example.com (for SLURM job notifications)
  # Per-stage partition overrides (optional) — falls back to slurm.partition.
  # msa:
  #   partition: kempner
  # boltz:
  #   partition: kempner_h100
  # esmc:
  #   partition: kempner_h100
  # esmfold:
  #   partition: kempner_h100
  #
  # Per-stage SLURM resource overrides (optional). Populated automatically by
  # the webapp's resource estimator (Import dialog → "Apply to session config").
  # Each entry maps a Snakemake `resources:` field; gpus=0 disables GPU request.
  # runtime is in minutes. For ESMC, `esmc` is the shared default; add
  # `esmc_<size>` (e.g. esmc_6B) to give a specific model size more memory.
  # resources:
  #   msa:      {mem_mb: 48000, runtime: 60,  cpus_per_task: 4,  gpus: 1}
  #   boltz:    {mem_mb: 16000, runtime: 60,  cpus_per_task: 8,  gpus: 1}
  #   esmc:     {mem_mb: 32000, runtime: 60,  cpus_per_task: 8,  gpus: 1}
  #   esmc_6B:  {mem_mb: 80000, runtime: 120, cpus_per_task: 8,  gpus: 1}
  #   esmc_sae: {mem_mb: 32000, runtime: 60,  cpus_per_task: 8,  gpus: 1}  # +esmc_sae_<size>
  #   esmfold:  {mem_mb: 32000, runtime: 120, cpus_per_task: 8,  gpus: 1}
