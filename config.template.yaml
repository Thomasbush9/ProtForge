# ProtForge Configuration Template for Kempner Cluster
# Copy this file to config.yaml and update paths marked with <YOUR_USER>

# Which pipeline stages to run
pipeline:
  msa: true
  boltz: true
  esm: true
  esmfold: false  # facebook/esmfold_v1 structure prediction (alternative to Boltz)
  es: false  # Requires additional setup - see docs/CLUSTER_SETUP.md

# Input data
input:
  fasta_dir: /n/home06/<YOUR_USER>/data/fastas
  # yaml_dir: /path/to/existing/yamls  # Use when pipeline.msa is false

# Output directory
output:
  parent_dir: /n/home06/<YOUR_USER>/outputs

# MSA generation - SHARED RESOURCES (no changes needed)
msa:
  max_files_per_job: 25
  array_max_concurrency: 10
  mmseq2_db: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/mmseq2_db
  colabfold_db: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/colabfold_db
  colabfold_bin: /n/holylfs06/LABS/kempner_shared/Everyone/common_envs/miniconda3/envs/boltz/localcolabfold/colabfold-conda/bin

# Boltz structure prediction - SHARED RESOURCES (no changes needed)
boltz:
  max_files_per_job: 25
  array_max_concurrency: 10
  delete_msa_after_processing: false
  recycling_steps: 10
  diffusion_samples: 25
  num_runs: 1                        # Number of independent Boltz runs per sequence
  cache_dir: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/boltz_db
  colabfold_db: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/colabfold_db
  env_path: /n/holylfs06/LABS/kempner_shared/Everyone/common_envs/miniconda3/envs/boltz

# ESM embeddings - USER SETUP REQUIRED
# See docs/CLUSTER_SETUP.md for environment setup instructions
esm:
  num_chunks: 1
  array_max_concurrency: 20
  env_path: /n/home06/<YOUR_USER>/envs/esm
  cache_dir: /n/holylfs06/LABS/bsabatini_lab/Everyone/esm_models_cache  # Shared ESM model weights
  # NOTE: The ESM library has hardcoded model paths in esm/utils/constants/esm3.py.
  # After installing the esm package, update those paths to match this cache_dir.
  # See docs/CLUSTER_SETUP.md for details.

# ESMFold structure prediction - USER SETUP REQUIRED
# Populate cache_dir first with: python esmfold_skeleton/download_esmfold.py --cache-dir <cache_dir>
esmfold:
  input_type: yaml  # "yaml" (post-MSA from sequences/) or "fasta" (raw input.fasta_dir, independent of MSA/Boltz)
  num_chunks: 1
  array_max_concurrency: 10
  env_path: /n/home06/<YOUR_USER>/envs/esmfold
  cache_dir: /n/holylfs06/LABS/bsabatini_lab/Everyone/esm_models_cache  # HF_HOME root; must contain hub/models--facebook--esmfold_v1

# ES analysis (optional) - USER SETUP REQUIRED
# Computes deformation metrics per sequence, averaging across Boltz runs.
# Set exactly ONE reference option: ref_dir, ref_path, or ref_seq.
es:
  pdanalysis_dir: /n/home06/<YOUR_USER>/PDAnalysis  # PDAnalysis repo (containing main.py)
  ref_dir: ""                              # Multi-run ref dir (has run_N/ subdirs)
  ref_path: /path/to/wildtype_structure.cif  # OR: single reference CIF file
  ref_seq: ""                              # OR: sequence name from this pipeline's output
  method: [strain]                         # Deformation methods (strain, shear, all, etc.)
  min_plddt: 70                            # pLDDT cutoff for residue filtering
  lddt_cutoffs: [0.125, 0.25, 0.5, 1]     # LDDT distance thresholds
  env_path: /n/home06/<YOUR_USER>/envs/es-analysis

# Container images (Singularity .sif files) — OPTIONAL
# Set paths to enable containerized execution. Leave empty for legacy mode.
# Pull with: singularity pull docker://ghcr.io/ORG/protforge-<stage>:latest
containers:
  colabfold: ""    # e.g., /n/home06/<YOUR_USER>/sifs/protforge-colabfold.sif
  boltz: ""        # e.g., /n/home06/<YOUR_USER>/sifs/protforge-boltz.sif
  esm: ""          # e.g., /n/home06/<YOUR_USER>/sifs/protforge-esm.sif
  esmfold: ""      # e.g., /n/home06/<YOUR_USER>/sifs/protforge-esmfold.sif
  pdanalysis: ""   # e.g., /n/home06/<YOUR_USER>/sifs/protforge-pdanalysis.sif
  bind_paths: "/n/holylfs06,/n/home06"

# SLURM settings - UPDATE FOR YOUR ACCOUNT
slurm:
  log_dir: /n/home06/<YOUR_USER>/job_logs
  partition: kempner_requeue
  account: <YOUR_SLURM_ACCOUNT>  # e.g., kempner_yourpi_lab
  email: <YOUR_EMAIL>  # e.g., user@example.com (for SLURM job notifications)
  # Per-job partition overrides (optional):
  # msa:
  #   partition: kempner
  # boltz:
  #   partition: kempner
