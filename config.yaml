# Which pipeline stages to run (default true if omitted; set false to skip)
pipeline:
  msa: true
  boltz: true
  esm: true
  es: true

input:
  fasta_dir: /n/home06/tbush/gfp_function_prediction/data/original
  # fasta_dir: /n/home06/tbush/gfp_function_prediction/data/20250815_102358_subsample/subsample
  # When pipeline.msa is false, set to existing YAML root (dir containing .yaml)
  # yaml_dir: /path/to/chunks_20240101_120000

# Output parent directory where all results will be stored
output:
  parent_dir: /n/home06/tbush/outputs

# MSA (Multiple Sequence Alignment) generation settings
msa:
  max_files_per_job: 25           # Maximum number of .fasta files per MSA array job
  array_max_concurrency: 10       # Maximum concurrent MSA array tasks
  mmseq2_db: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/mmseq2_db
  colabfold_db: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/colabfold_db
  colabfold_bin: /n/holylfs06/LABS/kempner_shared/Everyone/common_envs/miniconda3/envs/boltz/localcolabfold/colabfold-conda/bin

# Boltz structure prediction settings
boltz:
  max_files_per_job: 25            # Maximum number of .yaml files per boltz array job
  array_max_concurrency: 10       # Maximum concurrent boltz array tasks
  delete_msa_after_processing: false  # Delete MSA files after successful boltz processing
  recycling_steps: 10               # Number of recycling steps for boltz prediction
  diffusion_samples: 25            # Number of diffusion samples for boltz prediction
  num_runs: 1                       # Number of independent Boltz runs per sequence
  cache_dir: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/boltz_db
  colabfold_db: /n/holylfs06/LABS/kempner_shared/Everyone/workflow/boltz/colabfold_db
  env_path: /n/holylfs06/LABS/kempner_shared/Everyone/common_envs/miniconda3/envs/boltz

# ESM embeddings generation settings
esm:
  num_chunks: 1                    # Number of chunks for ESM array job
  array_max_concurrency: 20       # Maximum concurrent ESM array tasks
  env_path: /n/home06/tbush/envs/esm
  cache_dir: /n/holylfs06/LABS/bsabatini_lab/Everyone/esm_models_cache  # ESM model/embedding cache (TORCH_HOME + HF_HOME)

# ES (Evolutionary Scale / Effective Strain) analysis settings
es:
  pdanalysis_dir: /n/home06/tbush/PDAnalysis  # Directory containing main.py
  # Reference protein — set exactly ONE of ref_dir, ref_path, or ref_seq:
  ref_dir: ""                                  # Multi-run ref dir (has run_N/ subdirs)
  ref_path: /Users/thomasbush/Downloads/Boltz-project/original_structures/sequences/test_input_10/boltz/run_0/test_input_10_model_24.cif
  ref_seq: ""                                  # OR: sequence name from this pipeline
  method: [strain]                             # Deformation methods
  min_plddt: 70                                # pLDDT cutoff
  lddt_cutoffs: [0.125, 0.25, 0.5, 1]         # LDDT distance thresholds
  env_path: /n/home06/tbush/envs/es-analysis   # Conda env for ES (optional)

# Slurm (partition/account apply to all jobs unless overridden per job)
slurm:
  log_dir: /n/home06/tbush/job_logs
  partition: kempner_requeue
  account: kempner_bsabatini_lab
  email: thomasbush52@gmail.com
  # Optional per-job overrides (use same keys as pipeline + checker names)
  # msa:
  #   partition: other_partition
  # boltz:
  #   partition: other_partition
  # esm:
  #   partition: other_partition
  # es:
  #   partition: other_partition
  # checker_msa:
  #   partition: other_partition
  # checker_boltz:
  #   partition: other_partition
