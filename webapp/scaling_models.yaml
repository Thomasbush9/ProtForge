# ProtForge resource scaling models
# =================================
# Heuristic per-stage, per-GPU coefficients used by webapp/estimator.py to
# turn input statistics (count, mean/p95 sequence length) into SLURM resource
# recommendations (mem_mb, runtime, cpus, chunk size, partition).
#
# These defaults are anchored on:
#   - Boltz: O(L^2) attention activations and runtime; H100 baseline
#   - ESM/ESMFold: docs/SNAKEMAKE_GUIDE.md notes "5-30s per seq on H100"
#   - MSA: ColabFold/MMseq2 is mostly DB-bound; constant per seq + small per-residue
#   - ES: PDAnalysis is CPU-bound, scales with structures and residues
#
# After running slurm_scripts/calibrate.sh on the cluster, real numbers from
# benchmarks/*.tsv will be fit into webapp/scaling_models.calibrated.yaml,
# which the estimator prefers when present.

# Estimator-wide knobs
margins:
  mem_safety: 1.3      # multiply estimated mem by this before requesting
  time_safety: 1.5     # multiply estimated runtime by this
  min_runtime_min: 15  # never request less than this (SLURM scheduling overhead)

# GPU types currently in use on the cluster.
# `tier` orders from "cheapest/most-available" to "most-capable".
# H200 is intentionally left out — it's not in active use yet.
gpu_specs:
  a100_mig:
    mem_gb: 20
    partition: kempner_requeue
    tier: 0
    note: "MIG-partitioned A100 — may be assigned on kempner_requeue"
  a100:
    mem_gb: 40
    partition: kempner
    tier: 1
  a100_80:
    mem_gb: 80
    partition: kempner
    tier: 2
  h100:
    mem_gb: 80
    partition: kempner_h100
    tier: 3

# ---- Stages ---------------------------------------------------------------

msa:
  # ColabFold/MMseq2: DB-bound, GPU helps but isn't compute-heavy
  default_gpu: a100         # MSA tolerates MIG/A100 just fine
  cpus: 4
  gpus: 1
  per_gpu:
    a100:
      mem_mb:   {base: 16000, per_residue: 0.5, alpha_L2: 0.0}
      runtime_sec_per_chunk: {base: 60, per_seq: 8, per_residue: 0.02}
    h100:
      mem_mb:   {base: 16000, per_residue: 0.5, alpha_L2: 0.0}
      runtime_sec_per_chunk: {base: 50, per_seq: 6, per_residue: 0.015}
  target_chunk_runtime_min: 30
  max_chunk_size: 50
  min_chunk_size: 5

boltz:
  # O(L^2) attention; runtime dominates with recycling*samples*runs multiplier
  default_gpu: h100         # current production setting
  cpus: 8
  gpus: 1
  per_gpu:
    a100:
      mem_mb: {base: 8000, per_residue: 0.0, alpha_L2: 0.0010}
      runtime_sec_per_seq: {base: 45, alpha_L2: 0.0009}
    h100:
      mem_mb: {base: 8000, per_residue: 0.0, alpha_L2: 0.0008}
      runtime_sec_per_seq: {base: 30, alpha_L2: 0.0006}
  target_chunk_runtime_min: 45
  max_chunk_size: 40
  min_chunk_size: 1

esm:
  # ESM-C / ESM2 embeddings: roughly O(L) compute, O(L) memory
  default_gpu: a100
  cpus: 16
  gpus: 1
  per_gpu:
    a100:
      mem_mb: {base: 8000, per_residue: 8, alpha_L2: 0.0002}
      runtime_sec_per_seq: {base: 3, alpha_L: 0.08, alpha_L2: 0.0}
    h100:
      mem_mb: {base: 8000, per_residue: 8, alpha_L2: 0.0002}
      runtime_sec_per_seq: {base: 2, alpha_L: 0.05, alpha_L2: 0.0}
  target_chunk_runtime_min: 30
  max_chunk_size: 500
  min_chunk_size: 10

esmfold:
  # facebook/esmfold_v1 (~3B params). Memory dominated by O(L²) activations on
  # top of ~14 GB of model weights. Anchored to the docs note "5–30 s/seq on
  # H100" and published benchmarks (~25 GB at L=1000).
  default_gpu: h100
  cpus: 8
  gpus: 1
  per_gpu:
    a100:
      mem_mb: {base: 14000, alpha_L2: 0.020}
      runtime_sec_per_seq: {base: 5, alpha_L2: 0.00004}
    h100:
      mem_mb: {base: 14000, alpha_L2: 0.018}
      runtime_sec_per_seq: {base: 3, alpha_L2: 0.000022}
  target_chunk_runtime_min: 45
  max_chunk_size: 200
  min_chunk_size: 1

es:
  # PDAnalysis: CPU-bound — does NOT use GPU. Current config wastes one.
  default_gpu: null
  cpus: 8
  gpus: 0
  monolithic: true              # single SLURM job for all sequences
  per_gpu:
    cpu:
      mem_mb: {base: 8000, per_struct: 4, per_residue: 0.2}
      runtime_sec: {base: 120, per_struct: 5, per_residue: 0.05}
