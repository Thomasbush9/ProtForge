[project]
name = "protforge"
version = "0.1.0"
description = "Protein structure and function prediction pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.0",
    "numpy>=1.20",
    "PyYAML>=5.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
viz = [
    "plotly>=5.0",
    "py3Dmol>=2.0",
    "tmtools>=0.2",
]
webapp = [
    "streamlit>=1.49",
    "streamlit-autorefresh",
    "PyYAML>=5.0",
]
# Host-side launcher environment (Snakemake + webapp + utils). Mirrors
# requirements-host.txt — install with `pip install ".[host]"` or via the
# requirements file. The GPU SIF stays a separate concern.
host = [
    "snakemake>=8.10,<9",
    "snakemake-executor-plugin-slurm>=0.10",
    "streamlit>=1.49",
    "streamlit-autorefresh",
    "PyYAML>=5.0",
    "huggingface_hub>=0.20",
    "pandas>=1.0",
    "numpy>=1.20",
    "tqdm>=4.0",
]

[tool.pytest.ini_options]
# Both suites run by default. scripts/uniprot_fetch/tests is intentionally
# excluded — it ships its own venv/deps (see that dir's README).
testpaths = ["tests", "webapp/tests"]
# Put the source dirs on sys.path so tests can use bare imports
# (e.g. `from estimator import ...`) without a manual PYTHONPATH.
pythonpath = ["webapp", "workflow/scripts"]
