[project]
name = "protforge"
version = "0.1.0"
description = "Protein structure and function prediction pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.0",
    "numpy>=1.20",
    "PyYAML>=5.0",
    "tqdm>=4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
viz = [
    "plotly>=5.0",
]
dash = [
    "plotly>=5.0",
    "dash>=2.14,<5",
]
webapp = [
    "streamlit>=1.30",
    "streamlit-autorefresh",
    "PyYAML>=5.0",
]
# Host-side launcher environment (Snakemake + webapp + utils). Mirrors
# requirements-host.txt — install with `pip install ".[host]"` or via the
# requirements file. The GPU SIF stays a separate concern.
host = [
    "snakemake>=8.10,<9",
    "snakemake-executor-plugin-slurm>=0.10",
    "streamlit>=1.30",
    "streamlit-autorefresh",
    "PyYAML>=5.0",
    "huggingface_hub>=0.20",
    "pandas>=1.0",
    "numpy>=1.20",
    "tqdm>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
