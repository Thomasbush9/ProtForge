  - 6B
  max_files_per_job: 100
  chunks_per_group: 1
  cache_dir: /n/holylfs06/LABS/bsabatini_lab/Everyone/tbush/singularity_dev/images/cache_models
  sae:
    enabled: false
    sae_type: all-layers
    layers: all
    max_files_per_job: 25
    chunks_per_group: 1
openfold:
  num_batches: null
  max_files_per_job: 25
  gpus_per_job: 1
  num_workers: 10
  num_diffusion_samples: 5
  num_model_seeds: 1
